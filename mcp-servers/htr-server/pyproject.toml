[project]
name = "htr-server"
version = "0.1.0"
description = "Osmanlica el yazmasi HTR icin Kraken tabanli MCP sunucusu"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "kraken>=6.0.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htr_server"]
