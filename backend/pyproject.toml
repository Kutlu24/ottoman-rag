[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + RAG orchestrator (Claude API, MCP client olarak htr-kraken/transkribus/search-server'a baglanir)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "anthropic>=0.40.0",
    "mcp[cli]>=1.2.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    # Once ayri kurulmali:
    #   pip install -e ../packages/ottoman_rag_common
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
