[project]
name = "ingestion"
version = "0.1.0"
description = "HTR ciktisini provenance koruyarak chunk'layan ve vektor DB'ye yazan pipeline"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    # Once ayri kurulmali:
    #   pip install -e ../packages/ottoman_rag_common
    #   pip install -e ../mcp-servers/search-server
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
