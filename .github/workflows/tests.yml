name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e packages/ottoman_rag_common
          pip install -e "ingestion[dev]"
      - name: Test
        run: pytest -q ingestion/tests
